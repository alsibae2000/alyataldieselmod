**Design Movement:** صناعي-جريء (Bold Industrial) — الاختيار المختار

**Core Principles:**
1. القوة البصرية الصفراء — الأصفر الصناعي كعنصر مهيمن يعكس هوية المعدات الثقيلة
2. التباين الصارخ — أسود وأصفر كتركيبة تحذيرية صناعية كلاسيكية
3. الضخامة المدروسة — عناوين كبيرة ومساحات واسعة تعكس ضخامة المعدات
4. الوضوح الوظيفي — كل عنصر له غرض، لا زخارف غير ضرورية

**Color Philosophy:**
- أصفر صناعي ساطع: oklch(0.87 0.19 88) — لون الهوية الأساسي
- أسود فحمي: oklch(0.13 0.005 260) — خلفية تعطي ثقلاً وهيبة
- رمادي داكن: oklch(0.22 0.008 260) — للبطاقات والأقسام
- أبيض ناصع: oklch(0.98 0 0) — للنصوص على الخلفيات الداكنة

**Layout Paradigm:**
تخطيط بطولي كامل الشاشة مع قطع مائل بين الأقسام، والمحتوى يتوزع بين عمودين وثلاثة أعمدة حسب الحاجة، مع شريط تنقل ثابت شفاف يصبح معتماً عند التمرير

**Signature Elements:**
1. شريط أصفر سميك كعنصر تكراري (border-left أو divider)
2. أرقام ضخمة شفافة خلف العناوين
3. زوايا مقطوعة بـ clip-path للفصل بين الأقسام

**Interaction Philosophy:**
تأثيرات hover جريئة — الأزرار تملأ بالأصفر، البطاقات ترتفع، الروابط تُسطَّر بالأصفر

**Animation:**
- دخول العناصر من الأسفل عند التمرير (Intersection Observer)
- الأرقام العداد تتحرك عند الظهور
- الشعار يتحرك بخفة عند تحميل الصفحة

**Typography System:**
- العناوين الكبيرة: Cairo Black / ExtraBold (900)
- العناوين الفرعية: Cairo Bold (700)
- النصوص: Tajawal Regular (400) — مقروء ومريح
- التمييز والأرقام: Cairo SemiBold

