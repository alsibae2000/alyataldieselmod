# أفكار تصميم موقع آليات الديزل

## الهوية البصرية المطلوبة
- الاسم: آليات الديزل
- اللون الأساسي: أصفر صناعي
- التخصص: قطع غيار عرجات، شيولات، دركترات
- الموقع: جازان - المنطقة الصناعية

