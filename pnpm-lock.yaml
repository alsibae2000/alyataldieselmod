**Design Movement:** تقني-صناعي (Tech-Industrial) مع هوية خليجية

**Core Principles:**
1. الدقة الهندسية — شبكات وخطوط دقيقة تعكس الدقة في قطع الغيار
2. التدرج الضوئي — استخدام الضوء والظل لإعطاء عمق للعناصر
3. المعلوماتية البصرية — عرض المعلومات بطريقة منظمة ومرئية
4. الاحترافية الصامتة — تصميم يتكلم بالجودة لا بالصراخ

**Color Philosophy:**
- أصفر ذهبي: oklch(0.85 0.18 85) 
- أسود عميق: oklch(0.12 0.01 260)
- رمادي معدني: oklch(0.45 0.02 260)
- أبيض دافئ: oklch(0.97 0.01 90)

**Layout Paradigm:**
تخطيط ثلاثي الأعمدة مع شريط جانبي ثابت للتنقل على اليمين، والمحتوى يتدفق في عمودين

**Signature Elements:**
1. نقاط شبكية دقيقة كخلفية (dot grid pattern)
2. بطاقات بحواف معدنية لامعة
3. أيقونات مخصصة بأسلوب تقني

**Interaction Philosophy:**
تأثيرات ناعمة ومدروسة، كل تفاعل يعطي ردة فعل بصرية دقيقة

**Animation:**
- fade-in تدريجي للعناصر عند الظهور
- hover يرفع البطاقات بظل أعمق
- انتقالات سلسة بين الأقسام

**Typography System:**
- العناوين: Almarai Bold
- النصوص: Almarai Regular
- الأرقام: Roboto Mono

</idea>
