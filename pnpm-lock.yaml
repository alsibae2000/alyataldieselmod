**Design Movement:** Industrial Brutalism مع لمسة عربية معاصرة

**Core Principles:**
1. الخشونة الصناعية المتحكمة — استخدام الحواف الحادة والمساحات الواسعة لإيحاء بالقوة والمتانة
2. التباين العالي — أصفر صناعي ساطع على خلفية رمادية فحمية داكنة
3. الطباعة الجريئة — عناوين ضخمة تملأ الشاشة بأسلوب "صرخة بصرية"
4. التوازن غير المتماثل — تخطيط غير متوقع يكسر الرتابة

**Color Philosophy:**
- أصفر صناعي: #F5C518 (لون الآلات الثقيلة والتحذير)
- فحمي داكن: #1A1A1A (خلفية تعطي إحساس بالثقل والمتانة)
- رمادي فولاذي: #3D3D3D (للعناصر الثانوية)
- أبيض نقي: #FFFFFF (للنصوص والتفاصيل)

**Layout Paradigm:**
تخطيط عمودي مكثف مع كتل ضخمة متداخلة — قسم البطل يأخذ 90% من الشاشة مع نص مائل، والأقسام تتداخل بزوايا مقطوعة

**Signature Elements:**
1. خطوط مائلة تقطع الأقسام (clip-path diagonal)
2. أرقام ضخمة شفافة كخلفية للأقسام (مثل "01", "02")
3. شريط أصفر عريض كعنصر تكراري

**Interaction Philosophy:**
تأثيرات hover تكشف معلومات إضافية بانزلاق من الأسفل، والأزرار تملأ بالأصفر من اليسار

**Animation:**
- دخول العناوين من اليمين مع تأخير متدرج
- الكروت تنبض عند التمرير
- شريط التنقل يصبح معتماً عند التمرير

**Typography System:**
- العناوين: Cairo Black (ضخم جداً، 80-120px للبطل)
- النصوص: Tajawal Regular (مقروء، 16-18px)
- التمييز: أرقام بـ Space Grotesk

</idea>
